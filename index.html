<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>現勘量測工具</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:rgba(15,23,42,.92); --text:#f1f5f9; --muted:#94a3b8;
    --accent:#f59e0b; --accent2:#38bdf8; --danger:#ef4444; --ok:#22c55e; --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  #map{position:fixed;inset:0}
  .leaflet-container{background:#1e293b}

  /* 上方：圖層 */
  #top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:1000;
    display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .chip{pointer-events:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
  .chip.on{background:var(--accent2);color:#0f172a;border-color:var(--accent2);font-weight:700}
  .chip.ov.on{background:#a78bfa;border-color:#a78bfa}

  /* 結果面板 */
  #info{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1000;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;
    backdrop-filter:blur(6px);display:none}
  #info.show{display:block}
  #info .mode{font-size:12px;color:var(--muted)}
  #info .big{font-size:26px;font-weight:800;color:var(--accent);line-height:1.2;margin-top:2px}
  #info .sub{font-size:13px;color:var(--text);margin-top:2px}
  #info .hint{font-size:12px;color:var(--muted);margin-top:4px}
  #info .hint.warn{color:#fbbf24}
  #iAct{display:none;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  #iAct.show{display:flex}
  #iAct label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:1 1 100%;white-space:nowrap}
  #iAct input[type=range]{flex:1;accent-color:#a855f7}
  #iAct button{background:#a855f7;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
  #iAct button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:400}
  #info.auto .big{color:#c084fc}
  .btn.on.auto{background:rgba(168,85,247,.2);color:#c084fc}
  .pop b{font-size:15px}
  .pop .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;color:#fff;margin-bottom:4px}
  .pop button{margin-top:8px;background:#ef4444;color:#fff;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}

  /* 下方工具列 */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    display:flex;gap:4px;justify-content:space-around;backdrop-filter:blur(6px)}
  .btn{flex:1;min-width:0;background:transparent;border:0;color:var(--text);padding:6px 2px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
  .btn .ic{font-size:21px;line-height:1}
  .btn.on{background:rgba(245,158,11,.18);color:var(--accent)}
  .btn:disabled{opacity:.35}
  .btn.loc.tracking{color:var(--accent2)}

  /* 地圖標籤 */
  .seg-label{background:rgba(15,23,42,.85);color:#fff;border:0;border-radius:6px;padding:2px 6px;
    font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .seg-label::before{display:none}
  .area-label{background:rgba(245,158,11,.95);color:#111;font-size:13px}
  .vtx{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .me{width:18px;height:18px;border-radius:50%;background:var(--accent2);border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(56,189,248,.4),0 0 12px rgba(56,189,248,.8)}
  .cross{position:fixed;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;z-index:900;
    pointer-events:none;display:none}
  .cross.show{display:block}
  .cross::before,.cross::after{content:"";position:absolute;background:var(--accent);box-shadow:0 0 2px #000}
  .cross::before{left:13px;top:0;width:2px;height:28px}
  .cross::after{top:13px;left:0;height:2px;width:28px}

  #toast{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:1100;background:#111827;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #solar{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1001;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px);
    display:none;max-height:58vh;overflow:auto}
  #solar.show{display:block}
  #solar .sh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#fde68a}
  #solar .sh button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
  #solar .big{font-size:22px;font-weight:800;color:#fbbf24;margin-top:2px}
  #solar .sub{font-size:12.5px;line-height:1.5;margin-top:2px}
  #solar details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  #solar summary{font-size:13px;color:var(--accent2);cursor:pointer}
  #solar .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
  #solar .grid label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
  #solar .grid input,#solar .grid select{background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 7px;font-size:14px;width:100%}
  #solar .acts{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
  #solar .acts button{border:0;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;background:#f59e0b;color:#111}
  #solar .acts button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:400}
  .solar-label{background:rgba(30,58,138,.95);color:#fde68a}
  .pop .row{display:flex;gap:6px;margin-top:8px}
  .pop .row button{margin-top:0}
  .pop button.sol{background:#f59e0b;color:#111;font-weight:700}
  .leaflet-control-scale-line{background:rgba(255,255,255,.85);font-weight:600}
  .leaflet-bottom.leaflet-left{bottom:calc(76px + env(safe-area-inset-bottom))}
  .leaflet-bottom.leaflet-right{bottom:calc(76px + env(safe-area-inset-bottom))}
  .leaflet-control-attribution{font-size:9px}
  .leaflet-top.leaflet-right{margin-top:calc(88px + env(safe-area-inset-top))}

  /* ---------- 手機橫式：工具列改到右側直排，結果縮成左下小卡 ---------- */
  @media (orientation:landscape) and (max-height:540px){
    #top{left:calc(8px + env(safe-area-inset-left));right:calc(80px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top))}
    .chip{padding:6px 11px;font-size:12px}
    #bar{left:auto;top:0;right:0;bottom:0;width:calc(70px + env(safe-area-inset-right));
      flex-direction:column;justify-content:space-around;gap:2px;border-top:0;border-left:1px solid var(--line);
      padding:calc(4px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) 4px}
    .btn{flex:1;padding:1px 2px;font-size:10px;gap:1px;justify-content:center}
    .btn .ic{font-size:18px}
    #info{left:calc(8px + env(safe-area-inset-left));right:auto;width:240px;bottom:calc(8px + env(safe-area-inset-bottom));padding:7px 12px}
    #info .big{font-size:21px}
    #info .hint{display:none}
    .leaflet-right{right:calc(70px + env(safe-area-inset-right))}
    .leaflet-top.leaflet-right{margin-top:calc(44px + env(safe-area-inset-top))}
    .leaflet-bottom.leaflet-right{bottom:0}
    .leaflet-bottom.leaflet-left{bottom:calc(4px + env(safe-area-inset-bottom));left:calc(256px + env(safe-area-inset-left))}
    #toast{top:calc(46px + env(safe-area-inset-top))}
    #solar{left:calc(8px + env(safe-area-inset-left));right:auto;width:300px;bottom:calc(8px + env(safe-area-inset-bottom));max-height:calc(100vh - 60px)}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="cross" id="cross"></div>

<div id="top">
  <button class="chip on" data-base="photo">正射影像</button>
  <button class="chip" data-base="emap">電子地圖</button>
  <button class="chip" data-base="esri">Esri 衛星</button>
  <button class="chip ov" data-ov="road">道路地名</button>
  <button class="chip ov" data-ov="sect">地段</button>
</div>

<div id="info">
  <div class="mode" id="iMode"></div>
  <div class="big" id="iBig"></div>
  <div class="sub" id="iSub"></div>
  <div class="hint" id="iHint"></div>
  <div id="iAct">
    <label>容差 <input type="range" id="tol" min="4" max="60" step="1" value="16"><span id="tolV">16</span></label>
    <button class="ghost" id="bImg" style="display:none">🎨 改用影像辨識</button>
    <button class="ghost" id="bAdd">＋ 加選</button>
    <button class="ghost" id="bRect">▭ 方正化</button>
    <button class="ghost" id="bAdopt">拉點微調</button>
  </div>
</div>

<div id="bar">
  <button class="btn loc" id="bLoc"><span class="ic">📍</span>定位</button>
  <button class="btn" id="bDist"><span class="ic">📏</span>距離</button>
  <button class="btn" id="bArea"><span class="ic">⬠</span>面積</button>
  <button class="btn auto" id="bAuto"><span class="ic">🪄</span>自動</button>
  <button class="btn" id="bHere" disabled><span class="ic">🚶</span>GPS點</button>
  <button class="btn" id="bUndo" disabled><span class="ic">↶</span>復原</button>
  <button class="btn" id="bDone" disabled><span class="ic">✔</span>完成</button>
  <button class="btn" id="bClear"><span class="ic">🗑</span>清除</button>
</div>
<div id="solar">
  <div class="sh"><span>☀ 太陽能排佈模擬</span><button id="sClose" aria-label="關閉">✕</button></div>
  <div class="big" id="sBig">—</div>
  <div class="sub" id="sSub"></div>
  <details id="sSetBox"><summary>排佈設定（模組、走道、退縮）</summary>
    <div class="grid">
      <label>模組功率 (W)<input id="sW" type="number" inputmode="numeric" min="100" step="5"></label>
      <label>每幾排一條走道<input id="sN" type="number" inputmode="numeric" min="1" step="1"></label>
      <label>模組長 (mm)<input id="sL" type="number" inputmode="numeric" step="1"></label>
      <label>模組寬 (mm)<input id="sS" type="number" inputmode="numeric" step="1"></label>
      <label>走道寬 (m)<input id="sWalk" type="number" inputmode="decimal" min="0" step="0.1"></label>
      <label>邊界退縮 (m)<input id="sSet" type="number" inputmode="decimal" min="0" step="0.1"></label>
      <label>擺放<select id="sOri"><option value="P">直放（長邊前後）</option><option value="Lnd">橫放（長邊左右）</option></select></label>
      <label>排列方向<select id="sDir"><option value="long">沿最長邊</option><option value="long90">最長邊轉 90°</option><option value="south">東西向（朝正南）</option></select></label>
      <label>模組間隙 (cm)<input id="sGap" type="number" inputmode="decimal" min="0" step="0.5"></label>
    </div>
  </details>
  <div class="acts"><button class="ghost" id="sDel">移除排佈</button><button id="sDone">完成</button></div>
</div>
<div id="toast"></div>

<script>
(function(){
  // ---------- 地圖與圖層 ----------
  const NLSC = l => `https://wmts.nlsc.gov.tw/wmts/${l}/default/GoogleMapsCompatible/{z}/{y}/{x}`;
  const nlscAttr = '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">內政部國土測繪中心</a>';
  const bases = {
    photo: L.tileLayer(NLSC('PHOTO2'), {maxZoom:21, maxNativeZoom:20, attribution:nlscAttr}),
    emap:  L.tileLayer(NLSC('EMAP'),   {maxZoom:21, maxNativeZoom:20, attribution:nlscAttr}),
    esri:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
             {maxZoom:21, maxNativeZoom:19, attribution:'Esri World Imagery'})
  };
  const overlays = {
    road: L.tileLayer(NLSC('EMAP2'),    {maxZoom:21, maxNativeZoom:20}),
    sect: L.tileLayer(NLSC('LANDSECT'), {maxZoom:21, maxNativeZoom:20, opacity:.9})
  };

  const store = {
    get(k,d){ try{ const v = localStorage.getItem('sm_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem('sm_'+k, JSON.stringify(v)); }catch(e){} }
  };
  const view = store.get('view', {c:[23.7,120.95], z:8});
  const map = L.map('map', {zoomControl:false, attributionControl:true, tap:true}).setView(view.c, view.z);
  L.control.zoom({position:'topright'}).addTo(map);
  L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);
  map.on('moveend', ()=> store.set('view', {c:[map.getCenter().lat, map.getCenter().lng], z:map.getZoom()}));
  // 手機轉向時重新計算地圖尺寸
  window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));

  let curBase = store.get('base','photo'); if(!bases[curBase]) curBase='photo';
  bases[curBase].addTo(map);
  const ovOn = store.get('ov', {road:false, sect:false});
  Object.keys(ovOn).forEach(k => { if(ovOn[k] && overlays[k]) overlays[k].addTo(map); });

  function syncChips(){
    document.querySelectorAll('[data-base]').forEach(b => b.classList.toggle('on', b.dataset.base===curBase));
    document.querySelectorAll('[data-ov]').forEach(b => b.classList.toggle('on', !!ovOn[b.dataset.ov]));
  }
  syncChips();
  document.querySelectorAll('[data-base]').forEach(b => b.onclick = () => {
    map.removeLayer(bases[curBase]); curBase = b.dataset.base; bases[curBase].addTo(map); bases[curBase].bringToBack();
    store.set('base', curBase); syncChips();
  });
  document.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => {
    const k = b.dataset.ov; ovOn[k] = !ovOn[k];
    ovOn[k] ? overlays[k].addTo(map) : map.removeLayer(overlays[k]);
    store.set('ov', ovOn); syncChips();
  });

  // ---------- 工具 ----------
  const $ = id => document.getElementById(id);
  const toast = (msg, ms=2200) => { const t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), ms); };
  const fmtLen = m => m >= 1000 ? (m/1000).toFixed(3)+' km' : (m<100 ? m.toFixed(2) : m.toFixed(1))+' m';
  const fmtNum = (n,d=1) => n.toLocaleString('zh-TW',{minimumFractionDigits:d, maximumFractionDigits:d});
  // 球面多邊形面積（m²），同 Leaflet.draw geodesicArea
  function geoArea(lls){
    const R = 6378137, d2r = Math.PI/180; let a = 0, n = lls.length;
    if(n<3) return 0;
    for(let i=0;i<n;i++){
      const p1 = lls[i], p2 = lls[(i+1)%n];
      a += ((p2.lng - p1.lng)*d2r) * (2 + Math.sin(p1.lat*d2r) + Math.sin(p2.lat*d2r));
    }
    return Math.abs(a * R * R / 2);
  }
  const mid = (a,b) => L.latLng((a.lat+b.lat)/2, (a.lng+b.lng)/2);

  // ---------- 量測狀態 ----------
  const done = L.layerGroup().addTo(map);   // 已完成的量測
  let mode = null;            // 'dist' | 'area' | 'auto' | null
  let pts = [];               // 目前量測的點
  let adoptSrc = null;        // 由自動辨識轉來微調時 = 'auto'
  let live = L.layerGroup().addTo(map);
  const COLORS = {dist:'#38bdf8', area:'#f59e0b', auto:'#a855f7', bldg:'#22c55e'};

  const vIcon = L.divIcon({className:'', html:'<div class="vtx"></div>', iconSize:[14,14], iconAnchor:[7,7]});

  function drawShape(group, points, kind, final, src){
    const isAuto = src==='auto' || src==='bldg';
    const color = isAuto ? COLORS[src] : COLORS[kind];
    let shape = null;
    if(kind==='area' && points.length>=3){
      shape = L.polygon(points, {color, weight:3, fillColor:color, fillOpacity:.22, dashArray: final?null:(isAuto?'6 5':null)}).addTo(group);
    } else if(points.length>=2){
      shape = L.polyline(points, {color, weight:4}).addTo(group);
    }
    // 各段長度（自動辨識點多時不標，點少時只標 ≥ 3 m 的邊，避免字擠成一團）
    const segs = kind==='area' && points.length>=3 ? points.length : points.length-1;
    const skipSegs = isAuto && points.length > 10;
    for(let i=0;i<segs && !skipSegs;i++){
      const a = points[i], b = points[(i+1)%points.length];
      const d = map.distance(a,b);
      if(isAuto && d < 3) continue;
      L.tooltip({permanent:true, direction:'center', className:'seg-label'})
        .setLatLng(mid(a,b)).setContent(fmtLen(d)).addTo(group);
    }
    if(final && kind==='area' && points.length>=3){
      const A = geoArea(points);
      const c = L.polygon(points).getBounds().getCenter();
      L.tooltip({permanent:true, direction:'center', className:'seg-label area-label'})
        .setLatLng(c).setContent(`${src==='auto'?'🪄 ':src==='bldg'?'🏢 ':''}${fmtNum(A)} m²<br>${fmtNum(A*0.3025)} 坪`).addTo(group);
    }
    if(final && kind==='dist' && points.length>=2){
      L.tooltip({permanent:true, direction:'right', offset:[10,0], className:'seg-label area-label'})
        .setLatLng(points[points.length-1]).setContent('總長 '+fmtLen(total(points))).addTo(group);
    }
    return shape;
  }
  function total(points, closed){
    let s=0; for(let i=1;i<points.length;i++) s+=map.distance(points[i-1],points[i]);
    if(closed && points.length>=3) s+=map.distance(points[points.length-1], points[0]);
    return s;
  }

  function redraw(){
    live.clearLayers();
    drawShape(live, pts, mode, false, adoptSrc);
    pts.forEach((p,i) => {
      const m = L.marker(p, {icon:vIcon, draggable:true, autoPan:true}).addTo(live);
      m.on('drag', e => { pts[i] = e.target.getLatLng(); redrawLinesOnly(); });
      m.on('dragend', redraw);
    });
    updateInfo();
  }
  // 拖曳中只重畫線，不重建 marker（避免拖曳中斷）
  function redrawLinesOnly(){
    live.eachLayer(l => { if(!(l instanceof L.Marker)) live.removeLayer(l); });
    drawShape(live, pts, mode, false, adoptSrc); updateInfo();
  }

  function setHint(text, warn){ const h=$('iHint'); h.textContent=text; h.classList.toggle('warn', !!warn); }

  function updateInfo(){
    const box = $('info');
    box.classList.toggle('auto', mode==='auto');
    $('iAct').classList.toggle('show', mode==='auto' && !!cand);
    if(!mode){ box.classList.remove('show'); return; }
    box.classList.add('show');
    $('bUndo').disabled = mode==='auto' ? !(cand && seeds.length>1) : pts.length===0;
    if(mode==='auto'){
      $('iMode').textContent = '🪄 自動辨識輪廓';
      if(cand){
        $('iBig').textContent = `${fmtNum(cand.area)} m²`;
        $('iSub').textContent = `${fmtNum(cand.area*0.3025)} 坪 · 周長 ${fmtLen(total(cand.points,true))}`;
        if(cand.src==='bldg'){ setHint(cand.info + '｜不是要的範圍可按「改用影像辨識」'); $('bImg').style.display=''; $('bAdd').style.display=$('bRect').style.display='none'; } else { $('bImg').style.display='none'; $('bAdd').style.display=$('bRect').style.display=''; setHint(cand.warn || (cand.n>1 ? `已合併 ${cand.n} 塊。` : '') + '按「完成」保留；屋頂有板子分成好幾塊時，開「加選」逐塊點再按「方正化」', !!cand.warn); }
      } else {
        $('iBig').textContent = '—'; $('iSub').textContent = '';
        setHint(autoBusy ? '分析影像中…' : '點一下屋頂或空地，自動圈出同色範圍');
      }
      $('bDone').disabled = !cand;
      return;
    }
    if(mode==='dist'){
      $('iMode').textContent = '距離量測 · ' + pts.length + ' 點';
      $('iBig').textContent = fmtLen(total(pts));
      $('iSub').textContent = pts.length>=2 ? '最後一段 ' + fmtLen(map.distance(pts[pts.length-2], pts[pts.length-1])) : '';
    } else {
      const A = geoArea(pts);
      $('iMode').textContent = (adoptSrc==='auto' ? '🪄 自動辨識 · 微調中 · ' : '面積量測 · ') + pts.length + ' 點';
      $('iBig').textContent = pts.length>=3 ? `${fmtNum(A)} m²` : '—';
      $('iSub').textContent = pts.length>=3 ? `${fmtNum(A*0.3025)} 坪 · 周長 ${fmtLen(total(pts,true))}` : '';
    }
    setHint(pts.length===0 ? '點地圖加點；可拖曳白點微調' :
      (mode==='area' && pts.length<3 ? '至少 3 點才能算面積' : '按「完成」保留結果，可再開新量測'));
    $('bDone').disabled = mode==='dist' ? pts.length<2 : pts.length<3;
  }

  function setMode(m){
    if((mode==='dist'||mode==='area') && pts.length) finish(true);
    clearCand();
    mode = (mode===m) ? null : m;
    pts = []; adoptSrc = null; live.clearLayers();
    $('bDist').classList.toggle('on', mode==='dist');
    $('bArea').classList.toggle('on', mode==='area');
    $('bAuto').classList.toggle('on', mode==='auto');
    $('bHere').disabled = !(mode==='dist' || mode==='area');
    map.getContainer().style.cursor = mode ? 'crosshair' : '';
    if(!mode){ $('bUndo').disabled = true; $('bDone').disabled = true; }
    updateInfo();
    if(mode) toast({dist:'點地圖開始量距離', area:'點地圖圈出範圍量面積', auto:'點一下要辨識的屋頂或空地'}[mode]);
  }

  function finish(silent){
    if(mode==='auto'){
      if(!cand) return;
      const it = saveDone('area', cand.points, cand.src || 'auto', cand.info);
      if(!silent) toast(`已保留：${fmtNum(cand.area)} m²（${fmtNum(cand.area*0.3025)} 坪）・點一下區塊可做太陽能排佈`, 3500);
      clearCand(); updateInfo(); return it;
    }
    const ok = mode==='dist' ? pts.length>=2 : pts.length>=3;
    if(ok){
      saveDone(mode, pts, adoptSrc || 'manual');
      if(!silent){
        const msg = mode==='dist' ? '總長 '+fmtLen(total(pts))
          : `面積 ${fmtNum(geoArea(pts))} m²（${fmtNum(geoArea(pts)*0.3025)} 坪）`;
        toast('已保留：' + msg + (mode==='area' ? '・點一下區塊可做太陽能排佈' : ''), 3500);
      }
    }
    pts = []; adoptSrc = null; live.clearLayers(); updateInfo();
  }

  // ---------- 已保留的量測（重新整理後仍在；點一下可看資訊/刪除） ----------
  let items = store.get('done', []).map((it,i) => ({id: it.id || ('o'+i+'_'+Date.now()), k:it.k, p:it.p, src: it.src || 'manual', meta: it.meta, solar: it.solar}));
  store.set('done', items);
  function addDone(it){
    const g = L.layerGroup().addTo(done);
    const shape = drawShape(g, it.p.map(a=>L.latLng(a[0],a[1])), it.k, true, it.src);
    if(shape) shape.on('click', e => {
      if(mode) return;                       // 量測中：讓點擊照常加點
      L.DomEvent.stopPropagation(e);
      const lls = it.p.map(a=>L.latLng(a[0],a[1]));
      const tag = it.src==='auto' ? ['🪄 影像辨識', COLORS.auto] : it.src==='bldg' ? ['🏢 建物圖資', COLORS.bldg] : ['✋ 手動量測', COLORS[it.k]];
      const body = it.k==='area'
        ? `<b>${fmtNum(geoArea(lls))} m²</b>（${fmtNum(geoArea(lls)*0.3025)} 坪）<br>周長 ${fmtLen(total(lls,true))} · ${lls.length} 點`
        : `<b>總長 ${fmtLen(total(lls))}</b><br>${lls.length} 點`;
      const div = document.createElement('div'); div.className = 'pop';
      div.innerHTML = `<span class="tag" style="background:${tag[1]}">${tag[0]}</span><br>${body}${it.meta ? '<br><small>'+it.meta.replace(/^🏢 /,'')+'</small>' : ''}<div class="row">${it.k==='area' ? '<button class="sol">☀ '+(it.solar?'調整排佈':'太陽能排佈')+'</button>' : ''}<button class="del">刪除</button></div>`;
      if(div.querySelector('.sol')) div.querySelector('.sol').onclick = () => openSolar(it);
      div.querySelector('.del').onclick = () => {
        if(it.solar){ delete it.solar; drawSolar(it); }
        done.removeLayer(g); items = items.filter(x => x.id !== it.id); store.set('done', items);
        map.closePopup(); toast('已刪除');
      };
      L.popup({maxWidth:240}).setLatLng(e.latlng).setContent(div).openOn(map);
    });
    if(it.solar) drawSolar(it);
  }
  function saveDone(kind, points, src, meta){
    const it = {id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), k:kind, src, meta: meta || undefined,
      p:points.map(p=>[+p.lat.toFixed(7), +p.lng.toFixed(7)])};
    items.push(it); store.set('done', items); addDone(it);
    return it;
  }
  // ---------- ☀ 太陽能排佈：在已保留的面積上排模組、留維運走道、估容量 ----------
  const SOLAR_DEF = {w:495, L:2094, S:1134, ori:'P', dir:'long', n:4, walk:0.6, set:1.0, gap:2, hrs:1100};
  const solarRenderer = L.canvas({padding:0.3});
  const solarGroup = L.layerGroup().addTo(map);
  const solarLayers = {};        // item.id → layerGroup
  let solarItem = null;          // 目前在設定的那一筆

  function computeLayout(lls, o){
    // 局部公尺座標（以中心點為原點的等距投影，廠區尺度誤差可忽略）
    const lat0 = lls.reduce((s,p)=>s+p.lat,0)/lls.length, lng0 = lls.reduce((s,p)=>s+p.lng,0)/lls.length;
    const kx = 111320*Math.cos(lat0*Math.PI/180), ky = 110540;
    const XY = lls.map(p => [(p.lng-lng0)*kx, (p.lat-lat0)*ky]);
    // 排的方向：沿最長邊 / 最長邊轉 90° / 東西向（模組朝正南）
    let th = 0;
    if(o.dir !== 'south'){
      let best = -1;
      XY.forEach((a,i) => { const b = XY[(i+1)%XY.length], d = Math.hypot(b[0]-a[0], b[1]-a[1]);
        if(d > best){ best = d; th = Math.atan2(b[1]-a[1], b[0]-a[0]); } });
      if(o.dir === 'long90') th += Math.PI/2;
    }
    const c = Math.cos(th), s = Math.sin(th);
    const P = XY.map(([x,y]) => [x*c + y*s, -x*s + y*c]);          // 轉到排佈座標（列沿 x 軸）
    const back = ([u,v]) => { const x = u*c - v*s, y = u*s + v*c; return L.latLng(lat0 + y/ky, lng0 + x/kx); };
    const pip = (x,y) => { let ins=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const [xi,yi]=P[i],[xj,yj]=P[j];
      if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; };
    const fits = (x1,y1,x2,y2) => {           // 模組外擴退縮距離後，四角都在範圍內且沒有邊界頂點戳進來
      const a=x1-o.set, b=y1-o.set, cc=x2+o.set, d=y2+o.set;
      if(!(pip(a,b) && pip(cc,b) && pip(cc,d) && pip(a,d))) return false;
      for(const [x,y] of P) if(x>a && x<cc && y>b && y<d) return false;
      return true;
    };
    const mw = (o.ori==='P' ? o.S : o.L)/1000, md = (o.ori==='P' ? o.L : o.S)/1000;   // 沿列寬、列深
    const gap = o.gap/100, n = Math.max(1, o.n|0), walk = o.walk;
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    P.forEach(([x,y]) => { minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); });
    let best = null;
    // 試幾種起始位移，取片數最多的
    for(const fy of [0, .25, .5, .75]) for(const fx of [0, .33, .66]){
      const mods = [], rows = []; let y = minY + o.set + fy*(md+gap), r = 0;
      while(y + md <= maxY - o.set + 1e-6){
        const row = [];
        for(let x = minX + o.set + fx*(mw+gap); x + mw <= maxX - o.set + 1e-6; x += mw + gap)
          if(fits(x, y, x+mw, y+md)) row.push([x, y, x+mw, y+md]);
        rows.push({y, d:md, mods:row}); mods.push(...row);
        y += md; r++;
        y += (r % n === 0) ? walk : gap;
      }
      if(!best || mods.length > best.mods.length) best = {mods, rows};
    }
    // 維運走道位置（每 n 排之後），畫在相鄰兩排之間
    const walks = [];
    best.rows.forEach((row, i) => {
      if((i+1) % n !== 0 || i === best.rows.length-1) return;
      const nb = best.rows[i+1], all = row.mods.concat(nb.mods); if(!all.length || !row.mods.length || !nb.mods.length) return;
      const x1 = Math.min(...all.map(m=>m[0])), x2 = Math.max(...all.map(m=>m[2])), yy = row.y + row.d + walk/2;
      walks.push([back([x1,yy]), back([x2,yy])]);
    });
    const usedRows = best.rows.filter(r => r.mods.length).length;
    return {count: best.mods.length, rows: usedRows, walks,
      polys: best.mods.map(([x1,y1,x2,y2]) => [back([x1,y1]), back([x2,y1]), back([x2,y2]), back([x1,y2])])};
  }

  function drawSolar(it){
    if(solarLayers[it.id]){ solarGroup.removeLayer(solarLayers[it.id]); delete solarLayers[it.id]; }
    if(!it.solar) return null;
    const lls = it.p.map(a=>L.latLng(a[0],a[1]));
    const o = {...SOLAR_DEF, ...it.solar}, res = computeLayout(lls, o);
    const g = L.layerGroup();
    res.polys.forEach(q => L.polygon(q, {renderer:solarRenderer, color:'#93c5fd', weight:.6, fillColor:'#1e3a8a', fillOpacity:.85, interactive:false}).addTo(g));
    res.walks.forEach(w => L.polyline(w, {renderer:solarRenderer, color:'#facc15', weight:2, dashArray:'6 4', interactive:false}).addTo(g));
    const kwp = res.count*o.w/1000;
    if(res.count){
      const c = L.polygon(lls).getBounds().getCenter();
      L.tooltip({permanent:true, direction:'center', className:'seg-label solar-label', offset:[0,30]})
        .setLatLng(c).setContent(`☀ ${res.count.toLocaleString()} 片 · ${fmtNum(kwp,2)} kWp`).addTo(g);
    }
    g.addTo(solarGroup); solarLayers[it.id] = g;
    return {...res, kwp, o, area: geoArea(lls)};
  }

  const sIds = ['sW','sL','sS','sOri','sDir','sN','sWalk','sSet','sGap'];
  const sKey = {sW:'w', sL:'L', sS:'S', sOri:'ori', sDir:'dir', sN:'n', sWalk:'walk', sSet:'set', sGap:'gap'};
  function openSolar(it){
    map.closePopup();
    if(mode) setMode(mode);   // 結束量測模式
    solarItem = it;
    const o = {...SOLAR_DEF, ...store.get('solarDef', {}), ...(it.solar||{})};
    sIds.forEach(id => $(id).value = o[sKey[id]]);
    it.solar = readSolar();
    $('info').classList.remove('show'); $('solar').classList.add('show');
    refreshSolar();
    // 縮放到這塊，並避開排佈面板（直式在下方、橫式在左側）
    const land = matchMedia('(orientation:landscape) and (max-height:540px)').matches, pr = $('solar').getBoundingClientRect();
    map.fitBounds(L.polygon(it.p).getBounds(), land
      ? {paddingTopLeft:[pr.right + 16, 50], paddingBottomRight:[90, 16], maxZoom:20}
      : {paddingTopLeft:[20, 100], paddingBottomRight:[20, innerHeight - pr.top + 16], maxZoom:20});
  }
  function readSolar(){
    const o = {};
    sIds.forEach(id => { const v = $(id).value; o[sKey[id]] = (id==='sOri'||id==='sDir') ? v : Math.max(0, parseFloat(v)||0); });
    if(o.L < 300) o.L = SOLAR_DEF.L; if(o.S < 300) o.S = SOLAR_DEF.S; if(o.n < 1) o.n = 1; if(!o.w) o.w = SOLAR_DEF.w;
    return o;
  }
  function refreshSolar(){
    if(!solarItem) return;
    const r = drawSolar(solarItem);
    $('sBig').textContent = r.count ? `${r.count.toLocaleString()} 片 · ${fmtNum(r.kwp,2)} kWp` : '排不下任何模組';
    const modA = r.count * (r.o.L/1000) * (r.o.S/1000);
    $('sSub').innerHTML = r.count
      ? `${r.rows} 排 · 維運走道 ${r.walks.length} 條（每 ${r.o.n} 排一條，寬 ${r.o.walk} m）<br>` +
        `模組覆蓋 ${fmtNum(modA,0)} m² / 範圍 ${fmtNum(r.area,0)} m²（${fmtNum(modA/r.area*100,0)}%）<br>` +
        `粗估年發電 ≈ ${fmtNum(r.kwp*r.o.hrs/10000,1)} 萬度（以每 kWp 年發 ${r.o.hrs.toLocaleString()} 度計）`
      : '試著減少退縮距離、改直放/橫放或換方向';
  }
  sIds.forEach(id => { $(id).addEventListener('input', () => {
    if(!solarItem) return;
    solarItem.solar = readSolar(); clearTimeout(refreshSolar._t); refreshSolar._t = setTimeout(refreshSolar, 150);
  }); });
  $('sClose').onclick = $('sDone').onclick = () => {
    if(solarItem){ solarItem.solar = readSolar(); store.set('solarDef', solarItem.solar); store.set('done', items); toast('排佈已保留，點區塊可再調整'); }
    solarItem = null; $('solar').classList.remove('show');
  };
  $('sDel').onclick = () => {
    if(solarItem){ delete solarItem.solar; drawSolar(solarItem); store.set('done', items); toast('已移除排佈'); }
    solarItem = null; $('solar').classList.remove('show');
  };

  items.forEach(addDone);

  map.on('click', e => {
    if(mode==='auto'){ autoDetect(e.latlng); return; }
    if(!mode) return;
    pts.push(e.latlng); redraw();
  });

  $('bDist').onclick = () => setMode('dist');
  $('bArea').onclick = () => setMode('area');
  $('bAuto').onclick = () => setMode('auto');
  $('bUndo').onclick = () => { if(mode==='auto'){ if(seeds.length>1){ seeds.pop(); runDetect(); } return; } pts.pop(); redraw(); };
  $('bDone').onclick = () => finish(false);
  // 清除：按兩下確認（不用 confirm()，部分內嵌瀏覽器會直接擋掉對話框）
  let clearArmed = 0;
  $('bClear').onclick = () => {
    const b = $('bClear');
    if(Date.now() - clearArmed > 3000){
      clearArmed = Date.now();
      b.classList.add('on'); b.lastChild.textContent = '再按確認';
      toast('再按一次「清除」刪除所有量測結果');
      setTimeout(() => { if(Date.now() - clearArmed >= 3000){ b.classList.remove('on'); b.lastChild.textContent = '清除'; } }, 3050);
      return;
    }
    clearArmed = 0; b.classList.remove('on'); b.lastChild.textContent = '清除';
    done.clearLayers(); solarGroup.clearLayers(); Object.keys(solarLayers).forEach(k=>delete solarLayers[k]); live.clearLayers(); pts = []; items = []; store.set('done', []); clearCand(); updateInfo();
    toast('已清除');
  };

  // ---------- 🪄 自動辨識：點一下，從航照影像長出同色區域並描出輪廓 ----------
  let cand = null, candLayer = L.layerGroup().addTo(map), autoBusy = false, img = null;
  function clearCand(){ cand = null; seeds = []; candLayer.clearLayers(); }

  const S = 1024;  // 分析範圍 1024×1024 px（4×4 張圖磚）
  function tileUrl(z,x,y){
    return curBase==='esri'
      ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`
      : `https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/${z}/${y}/${x}`;
  }
  function loadImg(src){
    return new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  }
  async function getImagery(ll){
    const z = Math.max(17, Math.min(19, Math.round(map.getZoom()) + 1));
    const p = map.project(ll, z);
    const x0 = Math.floor((p.x - S/2)/256), y0 = Math.floor((p.y - S/2)/256);
    const key = [curBase==='esri'?'esri':'nlsc', z, x0, y0].join('/');
    if(img && img.key===key) return img;
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d', {willReadFrequently:true});
    const n = S/256, jobs = [];
    for(let ty=0; ty<n; ty++) for(let tx=0; tx<n; tx++)
      jobs.push(loadImg(tileUrl(z, x0+tx, y0+ty)).then(im => { if(im) ctx.drawImage(im, tx*256, ty*256); }));
    await Promise.all(jobs);
    const raw = ctx.getImageData(0,0,S,S).data;
    // 5×5 平均模糊，壓掉屋頂紋路/雜訊
    const N = S*S, R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N);
    for(let i=0;i<N;i++){ R[i]=raw[i*4]; G[i]=raw[i*4+1]; B[i]=raw[i*4+2]; }
    [R,G,B].forEach(ch => boxBlur(ch, S, S, 2));
    // 邊緣強度（中央差分），屋簷、圍牆、道路邊線會是高值 → 擋住區域蔓延
    const E = new Float32Array(N);
    for(let y=1;y<S-1;y++) for(let x=1;x<S-1;x++){ const i=y*S+x;
      E[i] = (Math.abs(R[i+1]-R[i-1]) + Math.abs(G[i+1]-G[i-1]) + Math.abs(B[i+1]-B[i-1])
            + Math.abs(R[i+S]-R[i-S]) + Math.abs(G[i+S]-G[i-S]) + Math.abs(B[i+S]-B[i-S])) / 2; }
    img = {key, z, ox:x0*256, oy:y0*256, R, G, B, E};
    return img;
  }
  function boxBlur(a, W, H, r){
    const t = new Float32Array(a.length), w = 2*r+1;
    for(let y=0;y<H;y++){ let s=0; const o=y*W;
      for(let x=-r;x<=r;x++) s += a[o+Math.min(W-1,Math.max(0,x))];
      for(let x=0;x<W;x++){ t[o+x]=s/w; s += a[o+Math.min(W-1,x+r+1)] - a[o+Math.max(0,x-r)]; } }
    for(let x=0;x<W;x++){ let s=0;
      for(let y=-r;y<=r;y++) s += t[Math.min(H-1,Math.max(0,y))*W+x];
      for(let y=0;y<H;y++){ a[y*W+x]=s/w; s += t[Math.min(H-1,y+r+1)*W+x] - t[Math.max(0,y-r)*W+x]; } }
  }
  // 方框形態學：dilate=true 膨脹、false 侵蝕
  function morph(m, W, H, r, dilate){
    const t = new Uint8Array(m.length), o = new Uint8Array(m.length), w = 2*r+1;
    const pass = (src, dst, len, cnt, idx) => {
      for(let line=0; line<cnt; line++){ let s=0;
        for(let k=-r;k<=r;k++){ const j=k<0||k>=len?-1:idx(line,k); s += j<0?(dilate?0:1):src[j]; }
        for(let k=0;k<len;k++){
          dst[idx(line,k)] = dilate ? (s>0?1:0) : (s===w?1:0);
          const a=k+r+1, b=k-r;
          s += (a>=len?(dilate?0:1):src[idx(line,a)]) - (b<0?(dilate?0:1):src[idx(line,b)]);
        } }
    };
    pass(m, t, W, H, (y,x)=>y*W+x);
    pass(t, o, H, W, (x,y)=>y*W+x);
    return o;
  }
  function flood(test, W, H, sx, sy){
    const m = new Uint8Array(W*H), st = new Int32Array(W*H); let sp = 0;
    const s0 = sy*W+sx; if(!test(s0)) return m;
    m[s0]=1; st[sp++]=s0;
    while(sp){ const i=st[--sp], x=i%W, y=(i/W)|0;
      if(x>0   && !m[i-1] && test(i-1)){ m[i-1]=1; st[sp++]=i-1; }
      if(x<W-1 && !m[i+1] && test(i+1)){ m[i+1]=1; st[sp++]=i+1; }
      if(y>0   && !m[i-W] && test(i-W)){ m[i-W]=1; st[sp++]=i-W; }
      if(y<H-1 && !m[i+W] && test(i+W)){ m[i+W]=1; st[sp++]=i+W; } }
    return m;
  }
  // Moore 鄰域外框追蹤 → 像素座標多邊形
  function trace(m, W, H){
    let s = -1; for(let i=0;i<m.length;i++) if(m[i]){ s=i; break; }
    if(s<0) return [];
    const dx=[1,1,0,-1,-1,-1,0,1], dy=[0,1,1,1,0,-1,-1,-1];
    const at=(x,y)=> x>=0&&y>=0&&x<W&&y<H&&m[y*W+x]===1;
    const sx=s%W, sy=(s/W)|0; let cx=sx, cy=sy, b=4; const out=[[sx,sy]];
    for(let it=0; it<W*H*2; it++){
      let f=-1; for(let k=1;k<=8;k++){ const d=(b+k)%8; if(at(cx+dx[d],cy+dy[d])){ f=d; break; } }
      if(f<0) break;
      const bx=cx+dx[(f+7)%8], by=cy+dy[(f+7)%8], nx=cx+dx[f], ny=cy+dy[f];
      for(let d=0;d<8;d++) if(dx[d]===bx-nx && dy[d]===by-ny){ b=d; break; }
      cx=nx; cy=ny;
      if(cx===sx && cy===sy) break;
      out.push([cx,cy]);
    }
    return out;
  }
  function dp(P, eps){   // Douglas–Peucker（開放折線）
    if(P.length<3) return P.slice();
    const [ax,ay]=P[0], [bx,by]=P[P.length-1], L2=(bx-ax)**2+(by-ay)**2;
    let md=-1, mi=0;
    for(let i=1;i<P.length-1;i++){
      const [px,py]=P[i];
      const d = L2===0 ? Math.hypot(px-ax,py-ay) : Math.abs((bx-ax)*(ay-py)-(ax-px)*(by-ay))/Math.sqrt(L2);
      if(d>md){ md=d; mi=i; }
    }
    if(md<=eps) return [P[0], P[P.length-1]];
    return dp(P.slice(0,mi+1),eps).slice(0,-1).concat(dp(P.slice(mi),eps));
  }
  function simplifyRing(P, eps){
    if(P.length<4) return P;
    let far=0, fd=-1; P.forEach((p,i)=>{ const d=(p[0]-P[0][0])**2+(p[1]-P[0][1])**2; if(d>fd){fd=d; far=i;} });
    const a = dp(P.slice(0,far+1), eps), b = dp(P.slice(far).concat([P[0]]), eps);
    return a.slice(0,-1).concat(b.slice(0,-1));
  }

  let seeds = [], addOn = false;
  // ---------- 🏢 國土測繪中心建物輪廓（經自己的 Cloudflare 中繼站） ----------
  const PROXY = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? 'http://localhost:8799' : 'https://nlsc-proxy.mnj711211.workers.dev';
  // 縣市碼 → 圖層名（各年份命名不一，照實測表）
  const BLAYERS = {
    A:{113:'113_A',114:'114_A',112:'112_A_11306'}, B:{113:'113_B',112:'112_B'}, C:{113:'113_C',112:'112_C'},
    D:{113:'113_D',112:'112_D'}, E:{113:'113_E',112:'111_E_v4'}, F:{113:'113_F',114:'114_F',112:'112_F'},
    G:{113:'113_G',114:'114_G',112:'112_G'}, H:{113:'113_H',114:'114_H',112:'112_H'}, I:{113:'113_I',112:'112_I'},
    J:{113:'113_J',114:'114_J',112:'112_J'}, K:{113:'113_K',114:'114_K',112:'112_K'}, M:{113:'113_M',114:'114_M',112:'112_M'},
    N:{113:'113_N',114:'114_N',112:'112_N'}, O:{113:'113_O',112:'112_O'}, P:{113:'113_P',114:'114_P',112:'112_P'},
    Q:{113:'113_Q',114:'114_Q',112:'112_Q'}, T:{113:'113_T',114:'114_T',112:'112_T'}, U:{113:'113_U',114:'114_U',112:'112_U'},
    V:{113:'113_V',114:'114_V',112:'112_V'}, W:{113:'113_W',112:'112_W'}, X:{113:'113_X',112:'112_X'}, Z:{113:'113_Z',112:'112_Z'}
  };
  const REGION = [
    [121.40,121.70,24.93,25.22,'AFC'],[121.55,122.05,24.90,25.35,'CFA'],[120.95,121.55,24.55,25.30,'FHA'],
    [121.05,121.45,24.55,25.15,'HFJ'],[120.85,121.30,24.55,24.95,'JOH'],[120.60,121.15,24.30,24.75,'KJ'],
    [120.45,121.45,23.95,24.45,'BKM'],[120.30,120.85,23.75,24.20,'NBM'],[120.65,121.35,23.45,24.25,'MBN'],
    [120.10,120.75,23.50,23.95,'PNQ'],[120.10,120.85,23.20,23.70,'QIP'],[120.35,120.55,23.42,23.55,'IQ'],
    [119.95,120.70,22.85,23.45,'DQ'],[120.15,121.05,22.45,23.30,'EDT'],[120.40,120.95,21.85,22.90,'TE'],
    [121.30,122.00,24.30,25.00,'GF'],[121.10,121.85,23.05,24.40,'UG'],[120.75,121.65,22.00,23.45,'VTU'],
    [118.10,118.60,24.30,24.60,'W'],[119.30,119.75,23.15,23.85,'X'],[119.90,120.60,25.90,26.40,'Z']
  ];
  let lastLetter = null;
  function lettersFor(ll){
    const out = [];
    if(lastLetter) out.push(lastLetter);
    REGION.forEach(([a,b,c,d,ls]) => { if(ll.lng>=a && ll.lng<=b && ll.lat>=c && ll.lat<=d) [...ls].forEach(l => { if(!out.includes(l)) out.push(l); }); });
    return out.slice(0,4);
  }
  async function nlsc(cmd, body){
    const r = await fetch(`${PROXY}/?cmd=${cmd}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }
  function inRing(ll, ring){   // ring: [[lat,lng],...]
    let ins = false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const [yi,xi]=ring[i], [yj,xj]=ring[j];
      if(((yi>ll.lat)!==(yj>ll.lat)) && (ll.lng < (xj-xi)*(ll.lat-yi)/(yj-yi)+xi)) ins = !ins;
    }
    return ins;
  }
  // 回傳點擊處那棟建物：{points, h, floors, name, year} 或 null
  async function findBuilding(ll){
    const letters = lettersFor(ll); if(!letters.length) return null;
    const d = 0.000004;
    const GEO = {type:'Polygon', coordinates:[[[ll.lng-d,ll.lat-d],[ll.lng+d,ll.lat-d],[ll.lng+d,ll.lat+d],[ll.lng-d,ll.lat+d],[ll.lng-d,ll.lat-d]]]};
    for(const year of ['113','114','112']){
      const tries = letters.filter(l => BLAYERS[l] && BLAYERS[l][year]);
      const res = await Promise.all(tries.map(l => nlsc('OV_SEARCHBYINTERSECT', {LAYERNAME:BLAYERS[l][year], SQL:'', EPSG:4326, GEO})
        .then(j => ({l, j})).catch(() => ({l, j:null}))));
      for(const {l, j} of res){
        if(!j || !j.SUCCESS || !j.RET || !j.RET.length) continue;
        lastLetter = l;
        const cands = j.RET.map(f => {
          const g = f.geo || {}, polys = /Multi/.test(g.type) ? g.coordinates : [g.coordinates];
          let best = null, bestA = -1;
          (polys||[]).forEach(poly => { const ring = (poly && poly[0] || []).map(c => [c[1], c[0]]);
            if(ring.length>2 && ring[0][0]===ring[ring.length-1][0] && ring[0][1]===ring[ring.length-1][1]) ring.pop();
            const A = geoArea(ring.map(a=>L.latLng(a[0],a[1]))); if(A>bestA){ bestA=A; best=ring; } });
          const at = f.attrs || [];
          return {ring:best, area:bestA, name:at[2]||'', h:+at[9]||0, floors:+at[12]||0, year};
        }).filter(c => c.ring);
        if(!cands.length) continue;
        const hit = cands.find(c => inRing(ll, c.ring)) || cands.sort((a,b)=>b.area-a.area)[0];
        return {...hit, points: hit.ring.map(a=>L.latLng(a[0],a[1]))};
      }
    }
    return null;
  }
  function bldgInfo(b){
    const bits = ['🏢 國土測繪中心建物圖資（' + b.year + ' 年）'];
    if(b.h) bits.push('樓高 ' + b.h.toFixed(1) + ' m');
    if(b.floors) bits.push(b.floors + ' 層');
    if(b.name && !['null','na','n/a','-'].includes(b.name.trim().toLowerCase())) bits.push(b.name);
    return bits.join(' · ');
  }
  async function useImage(){
    if(!seeds.length) return;
    const ll = seeds[0]; autoBusy = true; updateInfo();
    try{ await getImagery(ll); clearCand(); seeds = [ll]; runDetect(); }
    catch(err){ toast('影像讀取失敗：' + err.message, 3500); }
    finally{ autoBusy = false; updateInfo(); }
  }

  async function autoDetect(ll){
    if(autoBusy) return;
    autoBusy = true; updateInfo();
    try{
      // 加選模式且新點落在目前分析範圍內 → 沿用同一張影像、累加種子；否則重新開始
      let inside = false;
      if(addOn && cand && img){
        const p = map.project(ll, img.z);
        inside = p.x-img.ox > 8 && p.y-img.oy > 8 && p.x-img.ox < S-8 && p.y-img.oy < S-8;
      }
      if(!(addOn && cand)){
        // 先查國土測繪中心建物圖資；點的地方沒有建物（空地）才用影像辨識
        let b = null;
        try{ b = await findBuilding(ll); }catch(e){ console.warn('建物查詢失敗', e); }
        if(b){ clearCand(); seeds = [ll];
          cand = {points:b.points, area:geoArea(b.points), warn:'', n:1, src:'bldg', info:bldgInfo(b)};
          drawCand(); return; }
      }
      if(inside) seeds.push(ll);
      else {
        if(addOn && cand) toast('超出這次的分析範圍，改為重新辨識', 2500);
        await getImagery(ll); clearCand(); seeds = [ll];
      }
      runDetect();
    }
    catch(err){ toast('影像讀取失敗：' + err.message, 3500); }
    finally{ autoBusy = false; updateInfo(); }
  }
  // 從一個種子點長出同色區域（含開/閉運算），回傳遮罩
  function grow(sx, sy){
    const W=S, H=S, {R,G,B,E,z} = img;
    let mr=0,mg=0,mb=0,c=0;      // 種子顏色 = 點擊位置 5×5 平均
    for(let y=sy-2;y<=sy+2;y++) for(let x=sx-2;x<=sx+2;x++){ const i=y*W+x; mr+=R[i]; mg+=G[i]; mb+=B[i]; c++; }
    mr/=c; mg/=c; mb/=c;
    const T = +$('tol').value, T2 = T*T*3, Emax = Math.max(8, T*1.6);
    const raw = flood(i => { const a=R[i]-mr, b=G[i]-mg, d=B[i]-mb; return a*a+b*b+d*d <= T2 && E[i] <= Emax; }, W, H, sx, sy);
    const keepSeed = mm => mm[sy*W+sx] ? flood(i => mm[i]===1, W, H, sx, sy) : null;
    // 開運算切斷細細的連通（沿路面滲出去），再閉運算補小縫，只留跟點擊處相連的那塊
    const r = z>=19 ? 3 : 2;
    let m = keepSeed(morph(morph(raw,W,H,2,false),W,H,2,true)) || raw;
    m = morph(morph(m,W,H,r,true),W,H,r,false);
    m[sy*W+sx] = 1;
    return flood(i => m[i]===1, W, H, sx, sy);
  }
  function runDetect(){
    if(!img || !seeds.length) return;
    const W=S, H=S, {z,ox,oy} = img;
    const sp0 = seeds.map(ll => { const p = map.project(ll, z); return [Math.round(p.x-ox), Math.round(p.y-oy)]; })
      .filter(([x,y]) => x>=3 && y>=3 && x<W-3 && y<H-3);
    if(!sp0.length) return;
    let m = grow(...sp0[0]);
    for(let k=1;k<sp0.length;k++){ const g = grow(...sp0[k]); for(let i=0;i<m.length;i++) if(g[i]) m[i]=1; }
    let joined = true;
    if(sp0.length>1){
      // 多塊合併：用較大的閉運算把走道/間隙接起來
      const rr = z>=19 ? 9 : 5;
      m = morph(morph(m,W,H,rr,true),W,H,rr,false);
      const f = flood(i => m[i]===1, W, H, sp0[0][0], sp0[0][1]);
      joined = sp0.every(([x,y]) => f[y*W+x]);
      if(joined) m = f;
    }
    // 內部孔洞（屋頂上的板子、設備）補滿
    const outside = new Uint8Array(W*H), st = new Int32Array(W*H); let sp=0;
    const push = i => { if(!m[i] && !outside[i]){ outside[i]=1; st[sp++]=i; } };
    for(let x=0;x<W;x++){ push(x); push((H-1)*W+x); }
    for(let y=0;y<H;y++){ push(y*W); push(y*W+W-1); }
    while(sp){ const i=st[--sp], x=i%W, y=(i/W)|0;
      if(x>0) push(i-1); if(x<W-1) push(i+1); if(y>0) push(i-W); if(y<H-1) push(i+W); }
    let px=0, edge=false;
    for(let i=0;i<W*H;i++){ if(!outside[i]){ m[i]=1; px++; } }
    for(let x=0;x<W && !edge;x++) if(m[x]||m[(H-1)*W+x]) edge=true;
    for(let y=0;y<H && !edge;y++) if(m[y*W]||m[y*W+W-1]) edge=true;
    if(px < 60){ toast('範圍太小，試著調高容差或點在屋頂中央', 3000); return; }
    let ring;
    if(joined){
      ring = simplifyRing(trace(m,W,H), z>=19 ? 3.5 : 2.5);
    } else {
      // 幾塊連不起來 → 用外框把全部包起來
      const all = []; for(let i=0;i<m.length;i+=1) if(m[i]){ const x=i%W, y=(i/W)|0;
        if(!m[i-1]||!m[i+1]||!m[i-W]||!m[i+W]) all.push([x,y]); }
      ring = hull(all);
    }
    if(ring.length<3){ toast('沒抓到明確輪廓，請調整容差', 3000); return; }
    if(rectOn) ring = minRect(ring);
    const points = ring.map(([x,y]) => map.unproject(L.point(ox+x+0.5, oy+y+0.5), z));
    const warn = edge ? '⚠ 範圍溢出分析區（可能吃到路面/鄰地），請調低容差或放大地圖'
      : (!joined ? '幾塊之間距離較遠，已用外框連起來' : '');
    cand = {points, area: geoArea(points), warn, n: sp0.length};
    drawCand();
  }
  function drawCand(){
    if(!cand) return;
    const points = cand.points;
    candLayer.clearLayers();
    drawShape(candLayer, points, 'area', false, cand.src || 'auto');
    seeds.forEach(s => L.circleMarker(s, {radius:5, color:'#fff', weight:2, fillColor:COLORS[cand.src||'auto'], fillOpacity:1, interactive:false}).addTo(candLayer));
    updateInfo();
  }
  // 方正化：凸包 → 最小面積外接矩形（旋轉卡尺），適合廠房屋頂/方正空地
  let rectOn = false;
  function hull(P){
    const p = P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const cr = (o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
    const lo=[], up=[];
    for(const q of p){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
    for(const q of p.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
    return lo.slice(0,-1).concat(up.slice(0,-1));
  }
  function minRect(P){
    const H = hull(P); if(H.length<3) return P;
    let best = null;
    for(let i=0;i<H.length;i++){
      const a=H[i], b=H[(i+1)%H.length], L0=Math.hypot(b[0]-a[0],b[1]-a[1]); if(!L0) continue;
      const ux=(b[0]-a[0])/L0, uy=(b[1]-a[1])/L0;
      let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
      for(const q of H){ const u=q[0]*ux+q[1]*uy, v=-q[0]*uy+q[1]*ux;
        u0=Math.min(u0,u); u1=Math.max(u1,u); v0=Math.min(v0,v); v1=Math.max(v1,v); }
      const A=(u1-u0)*(v1-v0);
      if(!best || A<best.A) best={A,ux,uy,u0,u1,v0,v1};
    }
    const {ux,uy,u0,u1,v0,v1} = best, pt=(u,v)=>[u*ux - v*uy, u*uy + v*ux];
    return [pt(u0,v0), pt(u1,v0), pt(u1,v1), pt(u0,v1)];
  }
  $('bAdd').onclick = () => { addOn = !addOn; $('bAdd').style.background = addOn ? '#a855f7' : ''; toast(addOn ? '加選：再點其他區塊會合併進來' : '已關閉加選，下次點擊重新辨識'); };
  $('bRect').onclick = () => { rectOn = !rectOn; $('bRect').style.background = rectOn ? '#a855f7' : ''; runDetect(); };

  let tolTimer = null;
  $('tol').oninput = e => { $('tolV').textContent = e.target.value;
    clearTimeout(tolTimer); tolTimer = setTimeout(() => cand && cand.src==='bldg' ? useImage() : runDetect(), 120); };
  $('bImg').onclick = useImage;
  // 自動辨識結果 → 轉成可拖點的面積量測，修完按「完成」
  $('bAdopt').onclick = () => {
    if(!cand) return;
    const P = cand.points.slice();
    const src = cand.src || 'auto'; setMode('area'); pts = P; adoptSrc = src; redraw();
    toast('拖曳白點修正邊界，修好按「完成」');
  };

  // ---------- GPS 定位 ----------
  let meMarker = null, meCircle = null, watchId = null, lastPos = null, firstFix = true;
  const meIcon = L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[18,18], iconAnchor:[9,9]});
  function onPos(p){
    const ll = L.latLng(p.coords.latitude, p.coords.longitude), acc = p.coords.accuracy;
    lastPos = {ll, acc};
    if(!meMarker){
      meMarker = L.marker(ll, {icon:meIcon, interactive:false, zIndexOffset:1000}).addTo(map);
      meCircle = L.circle(ll, {radius:acc, color:'#38bdf8', weight:1, fillOpacity:.12, interactive:false}).addTo(map);
    } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(acc); }
    if(firstFix){ map.setView(ll, Math.max(map.getZoom(), 18)); firstFix = false;
      toast(`已定位（精度約 ±${Math.round(acc)} m）`); }
  }
  function onErr(e){
    const msg = {1:'未允許定位權限，請在瀏覽器設定開啟', 2:'無法取得位置（訊號不足）', 3:'定位逾時'}[e.code] || e.message;
    toast(msg, 3500); stopTrack();
  }
  function stopTrack(){
    if(watchId!=null) navigator.geolocation.clearWatch(watchId);
    watchId = null; $('bLoc').classList.remove('tracking');
  }
  $('bLoc').onclick = () => {
    if(!navigator.geolocation){ toast('此瀏覽器不支援定位'); return; }
    if(watchId!=null && lastPos){ map.setView(lastPos.ll, Math.max(map.getZoom(), 18)); return; }
    firstFix = true;
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
    $('bLoc').classList.add('tracking');
    toast('定位中…');
  };
  // 長按定位鈕 = 停止追蹤
  $('bLoc').oncontextmenu = e => { e.preventDefault(); stopTrack(); toast('已停止定位'); };

  // 用目前 GPS 位置加點（沿著邊界走一圈量測）
  $('bHere').onclick = () => {
    if(!lastPos){ toast('請先按「定位」取得 GPS 位置'); return; }
    if(lastPos.acc > 15) toast(`注意：目前 GPS 精度 ±${Math.round(lastPos.acc)} m，誤差較大`, 3000);
    pts.push(lastPos.ll); redraw();
  };
})();
</script>
